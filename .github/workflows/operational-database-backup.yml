name: Daily encrypted operational database backup

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: absensi
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_EXPECTED_DATABASE_HOST: ${{ vars.BACKUP_EXPECTED_DATABASE_HOST }}
      BACKUP_EXPECTED_DATABASE_PORT: ${{ vars.BACKUP_EXPECTED_DATABASE_PORT }}
      BACKUP_EXPECTED_DATABASE_NAME: ${{ vars.BACKUP_EXPECTED_DATABASE_NAME }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: absensi/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts
      - name: Validate backup configuration
        run: |
          node --input-type=module -e '
            const required = ["DATABASE_URL", "BACKUP_EXPECTED_DATABASE_HOST", "BACKUP_EXPECTED_DATABASE_PORT", "BACKUP_EXPECTED_DATABASE_NAME", "GOOGLE_DRIVE_CLIENT_ID", "GOOGLE_DRIVE_CLIENT_SECRET", "GOOGLE_DRIVE_REFRESH_TOKEN", "BACKUP_ENCRYPTION_KEY"];
            const missing = required.filter((name) => !process.env[name]?.trim());
            if (missing.length) {
              console.error(`Missing required GitHub Actions secrets or repository variables: ${missing.join(", ")}`);
              process.exit(1);
            }
          '
      - run: node scripts/operational-backup.mjs backup
